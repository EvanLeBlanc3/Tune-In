<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tune In">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#cfd0d5">
<title>Tune In</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* ==========================================================
   TUNE IN — styles
   ========================================================== */
:root {
  --px: 'Press Start 2P', ui-monospace, monospace;
  --vt: 'VT323', ui-monospace, monospace;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--page); overscroll-behavior: none; }
body {
  font-family: var(--vt); color: var(--fg); touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.pi { height: 1em; display: inline-block; vertical-align: -0.12em; flex: none; }
#file { position: fixed; left: -9999px; top: 0; opacity: 0; width: 1px; height: 1px; }
#haptic { position: fixed; left: -9999px; top: 0; opacity: 0; pointer-events: none; }

/* ---------- Device ---------- */
#app { position: fixed; inset: 0; display: flex; justify-content: center; }
#device {
  position: relative; width: 100%; max-width: 480px; height: 100%;
  display: flex; flex-direction: column; align-items: center;
  padding: calc(var(--safe-t) + 18px) 16px calc(var(--safe-b) + 12px);
  background:
    radial-gradient(120% 60% at 30% 0%, rgba(255,255,255,.35), transparent 60%),
    linear-gradient(180deg, var(--body), var(--body2));
  transition: background .3s;
}
#device::after { /* subtle pixel grain */
  content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .06;
  background-image: linear-gradient(90deg, rgba(0,0,0,.6) 1px, transparent 1px), linear-gradient(rgba(0,0,0,.6) 1px, transparent 1px);
  background-size: 4px 4px;
}

/* stepped "pixel" corners */
.pxc { clip-path: polygon(0 12px, 4px 12px, 4px 8px, 8px 8px, 8px 4px, 12px 4px, 12px 0, calc(100% - 12px) 0, calc(100% - 12px) 4px, calc(100% - 8px) 4px, calc(100% - 8px) 8px, calc(100% - 4px) 8px, calc(100% - 4px) 12px, 100% 12px, 100% calc(100% - 12px), calc(100% - 4px) calc(100% - 12px), calc(100% - 4px) calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) calc(100% - 4px), calc(100% - 12px) calc(100% - 4px), calc(100% - 12px) 100%, 12px 100%, 12px calc(100% - 4px), 8px calc(100% - 4px), 8px calc(100% - 8px), 4px calc(100% - 8px), 4px calc(100% - 12px), 0 calc(100% - 12px)); }

#screen-wrap {
  width: 100%; flex: 0 0 auto; height: min(52%, 470px); padding: 10px;
  background: var(--bezel); position: relative; z-index: 1;
  clip-path: polygon(0 12px, 4px 12px, 4px 8px, 8px 8px, 8px 4px, 12px 4px, 12px 0, calc(100% - 12px) 0, calc(100% - 12px) 4px, calc(100% - 8px) 4px, calc(100% - 8px) 8px, calc(100% - 4px) 8px, calc(100% - 4px) 12px, 100% 12px, 100% calc(100% - 12px), calc(100% - 4px) calc(100% - 12px), calc(100% - 4px) calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) calc(100% - 4px), calc(100% - 12px) calc(100% - 4px), calc(100% - 12px) 100%, 12px 100%, 12px calc(100% - 4px), 8px calc(100% - 4px), 8px calc(100% - 8px), 4px calc(100% - 8px), 4px calc(100% - 12px), 0 calc(100% - 12px));
}
#screen {
  position: relative; height: 100%; overflow: hidden; display: flex; flex-direction: column;
  background: var(--lcd); color: var(--fg); transition: filter .6s, background .3s;
  box-shadow: inset 0 0 0 2px rgba(0,0,0,.25), inset 0 6px 14px rgba(0,0,0,.18);
}
#screen.dim { filter: brightness(.38) saturate(.6); }
body.glow #screen { text-shadow: 0 0 3px rgba(0,0,0,.12); }

#status {
  flex: 0 0 28px; display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; padding: 0 8px;
  font-family: var(--px); font-size: 9px; background: var(--status); border-bottom: 2px solid var(--fg);
}
#st-title { text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st-l { display: flex; gap: 5px; font-size: 10px; }
.st-r { display: flex; gap: 6px; justify-content: flex-end; align-items: center; font-size: 8px; }
#st-clock { display: none; }

#views { flex: 1; position: relative; overflow: hidden; }
.view { position: absolute; inset: 0; }
.in-left { animation: inL .18s steps(4) both; } .out-left { animation: outL .18s steps(4) both; }
.in-right { animation: inR .18s steps(4) both; } .out-right { animation: outR .18s steps(4) both; }
@keyframes inL { from { transform: translateX(100%); } to { transform: none; } }
@keyframes outL { to { transform: translateX(-100%); } }
@keyframes inR { from { transform: translateX(-100%); } to { transform: none; } }
@keyframes outR { to { transform: translateX(100%); } }

/* scanlines & flash */
#scan { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
body[data-scan="1"] #scan { background: repeating-linear-gradient(to bottom, rgba(0,0,0,.07) 0 1px, transparent 1px 3px); }
body[data-scan="2"] #scan { background: repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 1px, transparent 1px 3px), repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 1px, transparent 1px 3px); }
#flash { position: absolute; inset: 0; pointer-events: none; z-index: 6; background: var(--fg); opacity: 0; transition: opacity .12s; }
#flash.on { opacity: .12; transition: none; } #flash.on.strong { opacity: .45; }
#screen.shake { animation: shake .25s steps(5); }
@keyframes shake { 20% { transform: translateX(-3px); } 40% { transform: translateX(3px); } 60% { transform: translateX(-2px); } 80% { transform: translateX(2px); } }

#toast {
  position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%) scale(.6); z-index: 7;
  background: var(--fg); color: var(--lcd); font-family: var(--px); font-size: 10px; line-height: 1.6; text-align: center;
  padding: 10px 14px; opacity: 0; pointer-events: none; white-space: nowrap;
  box-shadow: 0 0 0 3px var(--lcd), 0 0 0 5px var(--fg), 6px 6px 0 5px rgba(0,0,0,.25);
}
#toast.show { animation: pop .22s steps(3) forwards; }
#toast.big { font-size: 12px; } #toast small { font-size: 8px; opacity: .8; }
@keyframes pop { from { opacity: 1; transform: translate(-50%, -50%) scale(.4); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }

/* ---------- Lists ---------- */
.list { overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; overscroll-behavior: contain; scrollbar-width: none; }
.list::-webkit-scrollbar { display: none; }
.row {
  display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 10px;
  font-size: 25px; line-height: 1; white-space: nowrap; cursor: pointer;
}
.row.two { min-height: 46px; }
.row .ic { width: 20px; font-size: 15px; display: flex; justify-content: center; flex: none; }
.row .lb { flex: 1; min-width: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
.row .lb > span { display: inline-block; white-space: nowrap; }
.row .lb small { font-size: 18px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.row .rt { font-size: 20px; color: var(--dim); flex: none; max-width: 45%; overflow: hidden; text-overflow: ellipsis; }
.row .cv { font-size: 14px; flex: none; }
.row.sel { background: var(--hl); color: var(--hlfg); }
.row.sel .lb small, .row.sel .rt { color: var(--hlfg); opacity: .85; }
.row.dis { opacity: .75; }
.lb.marq > span, .np-title.marq > span { animation: marq var(--t, 4s) linear infinite; }
@keyframes marq { 0%, 15% { transform: none; } 85%, 100% { transform: translateX(var(--d)); } }
.empty { font-family: var(--px); font-size: 10px; text-align: center; padding: 40px 16px; line-height: 2; color: var(--dim); }

.alb-head { display: flex; gap: 10px; padding: 10px; align-items: center; border-bottom: 2px dashed var(--dim); }
.alb-head b { display: block; font-size: 24px; font-weight: normal; line-height: 1; }
.alb-head small { display: block; font-size: 18px; color: var(--dim); }
.alb-art { width: 64px; height: 64px; flex: none; background: var(--dim); box-shadow: 0 0 0 2px var(--fg); }
.alb-art img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; display: block; }
.alb-art img:not([src]) { display: none; }
.viz-preview { display: block; width: 100%; height: 70px; image-rendering: pixelated; border-bottom: 2px solid var(--fg); }

/* ---------- Now Playing ---------- */
.np { display: flex; flex-direction: column; padding: 10px 12px 8px; gap: 7px; }
.np-top { display: flex; gap: 12px; flex: 1; min-height: 0; }
.np-art { position: relative; width: 42%; max-width: 170px; aspect-ratio: 1; flex: none; align-self: flex-start; background: var(--dim); box-shadow: 0 0 0 2px var(--fg), 4px 4px 0 2px rgba(0,0,0,.2); cursor: pointer; }
.np-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.np-art img.px { image-rendering: pixelated; }
.np-noart { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 48px; color: var(--lcd); background: var(--dim); background-image: repeating-linear-gradient(45deg, rgba(0,0,0,.12) 0 6px, transparent 6px 12px); }
.np-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.np-count { font-family: var(--px); font-size: 8px; color: var(--dim); margin-bottom: 4px; }
.np-title { font-size: 27px; line-height: 1; overflow: hidden; white-space: nowrap; }
.np-title > span { display: inline-block; }
.np-artist, .np-album { font-size: 20px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-album { color: var(--dim); }
.np-btns { display: flex; gap: 6px; margin-top: auto; padding-top: 4px; }
.np-btns button { position: relative; width: 32px; height: 28px; font-size: 13px; display: flex; align-items: center; justify-content: center; color: var(--dim); box-shadow: inset 0 0 0 2px var(--dim); }
.np-btns button.on { color: var(--hlfg); background: var(--hl); box-shadow: inset 0 0 0 2px var(--hl); }
.np-btns button i { position: absolute; right: 2px; bottom: 1px; font-family: var(--px); font-size: 6px; font-style: normal; }
.np-mini { width: 100%; height: 26px; image-rendering: pixelated; display: block; flex: none; }
.np-prog { flex: none; }
.bar { position: relative; height: 12px; box-shadow: inset 0 0 0 2px var(--fg); cursor: pointer; touch-action: none; }
.bar i { position: absolute; left: 2px; top: 2px; bottom: 2px; max-width: calc(100% - 4px); background: repeating-linear-gradient(90deg, var(--fg) 0 4px, transparent 4px 6px); }
.bar b { position: absolute; top: -3px; width: 6px; height: 18px; margin-left: -3px; background: var(--fg); }
.times { display: flex; justify-content: space-between; font-family: var(--px); font-size: 8px; margin-top: 6px; }
.times .mode { color: var(--dim); }
.np-vol { flex: none; display: flex; align-items: center; gap: 8px; font-size: 13px; }
.vbar { flex: 1; display: flex; gap: 2px; height: 14px; align-items: flex-end; cursor: pointer; touch-action: none; padding: 2px 0; }
.vbar i { flex: 1; height: 40%; background: var(--dim); opacity: .35; }
.vbar i:nth-child(n+5) { height: 55%; } .vbar i:nth-child(n+9) { height: 75%; } .vbar i:nth-child(n+13) { height: 100%; }
.vbar i.on { background: var(--fg); opacity: 1; }

/* ---------- Visualizer ---------- */
.vizview canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; cursor: pointer; }
.viz-label { position: absolute; left: 0; right: 0; top: 8px; text-align: center; font-family: var(--px); font-size: 9px; color: var(--fg); text-shadow: 2px 2px 0 var(--lcd); pointer-events: none; }
.viz-label.pop { animation: lbl 2.2s steps(6) forwards; }
@keyframes lbl { 0% { transform: scale(1.4); opacity: 1; } 15% { transform: none; } 75% { opacity: 1; } 100% { opacity: .0; } }
.viz-hint { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-family: var(--px); font-size: 6px; color: var(--dim); pointer-events: none; text-shadow: 1px 1px 0 var(--lcd); }

#fullviz { position: fixed; inset: 0; z-index: 50; background: var(--lcd); display: none; touch-action: none; }
#fullviz.open { display: block; animation: fvIn .3s steps(6); }
@keyframes fvIn { from { clip-path: circle(0 at 50% 75%); } to { clip-path: circle(150% at 50% 75%); } }
#fullviz canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.fv-hud { position: absolute; inset: 0; opacity: 0; transition: opacity .25s steps(3); pointer-events: none; font-family: var(--px); color: var(--fg); }
.fv-hud.show { opacity: 1; pointer-events: auto; }
.fv-hud > * { pointer-events: auto; }
.fv-track { position: absolute; top: calc(var(--safe-t) + 24px); left: 16px; right: 64px; font-size: 10px; line-height: 1.5; text-shadow: 2px 2px 0 var(--lcd); }
.fv-mode { position: absolute; top: calc(var(--safe-t) + 48px); left: 16px; font-size: 8px; color: var(--dim); text-shadow: 2px 2px 0 var(--lcd); }
.fv-close { position: absolute; top: calc(var(--safe-t) + 16px); right: 14px; width: 40px; height: 40px; font-size: 16px; background: var(--fg); color: var(--lcd); }
.fv-btns { position: absolute; left: 12px; right: 12px; bottom: calc(var(--safe-b) + 46px); display: flex; gap: 8px; justify-content: center; }
.fv-btns button { min-width: 48px; height: 44px; padding: 0 10px; font-size: 9px; background: var(--fg); color: var(--lcd); box-shadow: 4px 4px 0 rgba(0,0,0,.35); }
.fv-btns button .pi { font-size: 14px; }
.fv-btns button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 rgba(0,0,0,.35); }
.fv-tip { position: absolute; left: 0; right: 0; bottom: calc(var(--safe-b) + 18px); text-align: center; font-size: 7px; color: var(--dim); text-shadow: 1px 1px 0 var(--lcd); }

/* ---------- Equalizer ---------- */
.eqv { display: flex; flex-direction: column; padding: 8px 10px; }
.eq-top { display: flex; justify-content: space-between; font-family: var(--px); font-size: 8px; padding-bottom: 6px; border-bottom: 2px dashed var(--dim); }
.eq-bands { flex: 1; display: flex; gap: 3px; padding: 8px 0 4px; min-height: 0; }
.eqb { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.eq-track { position: relative; flex: 1; width: 100%; display: flex; flex-direction: column; gap: 2px; padding: 2px 0; touch-action: none; cursor: pointer; }
.eq-track i { flex: 1; background: var(--dim); opacity: .25; margin: 0 3px; }
.eq-track i:nth-child(6) { margin-bottom: 2px; }
.eq-track i.on { opacity: 1; background: var(--fg); }
.eq-track b { position: absolute; left: 0; right: 0; height: 4px; margin-top: -2px; background: var(--fg); }
.eqb.sel .eq-track { box-shadow: 0 0 0 2px var(--hl); }
.eqb.sel .eq-track i.on, .eqb.sel .eq-track b { background: var(--hl); }
.eqb label { font-family: var(--px); font-size: 6px; }
.eqb.sel label { color: var(--hl); }
.eq-hint { text-align: center; font-family: var(--px); font-size: 6px; color: var(--dim); }

/* ---------- Stats ---------- */
.stats { overflow-y: auto; padding: 10px 12px; touch-action: pan-y; }
.lv { display: flex; align-items: center; gap: 10px; }
.lv-badge { display: flex; align-items: center; gap: 6px; font-family: var(--px); font-size: 14px; background: var(--hl); color: var(--hlfg); padding: 6px 8px; }
.lv-badge b { font-weight: normal; }
.lv-rank { font-family: var(--px); font-size: 8px; line-height: 1.5; }
.xpbar { height: 12px; margin: 10px 0 4px; box-shadow: inset 0 0 0 2px var(--fg); padding: 2px; }
.xpbar i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--hl) 0 4px, transparent 4px 6px); }
.xptxt { font-family: var(--px); font-size: 7px; color: var(--dim); margin-bottom: 8px; }
.srow { display: flex; justify-content: space-between; gap: 10px; font-size: 22px; padding: 3px 0; border-bottom: 1px dashed var(--dim); }
.srow b { font-weight: normal; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xptip { font-family: var(--px); font-size: 6px; color: var(--dim); margin-top: 10px; text-align: center; line-height: 1.6; }

/* ---------- Import ---------- */
.imp { display: flex; flex-direction: column; gap: 10px; padding: 14px; overflow-y: auto; touch-action: pan-y; }
.pxbtn { font-family: var(--px); font-size: 10px; padding: 14px 10px; background: var(--hl); color: var(--hlfg); box-shadow: 4px 4px 0 var(--fg); display: flex; gap: 8px; align-items: center; justify-content: center; }
.pxbtn.alt { background: var(--lcd); color: var(--fg); box-shadow: inset 0 0 0 2px var(--fg), 4px 4px 0 var(--fg); font-size: 8px; }
.pxbtn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--fg); }
.imp-prog { height: 12px; box-shadow: inset 0 0 0 2px var(--fg); padding: 2px; visibility: hidden; }
.imp-prog.on { visibility: visible; }
.imp-prog i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--fg) 0 4px, transparent 4px 6px); transition: width .2s steps(4); }
.imp-msg { font-size: 20px; line-height: 1.1; text-align: center; }
.imp-msg small { font-family: var(--px); font-size: 7px; color: var(--dim); }

/* ---------- Brand + wheel ---------- */
#brand { flex: none; text-align: center; margin: 14px 0 0; color: var(--brand); font-family: var(--px); line-height: 1.5; }
#brand b { display: block; font-size: 11px; letter-spacing: 3px; font-weight: normal; }
#brand span { display: block; font-size: 6px; letter-spacing: 2px; opacity: .8; }
#wheel-area { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; filter: drop-shadow(0 6px 0 rgba(0,0,0,.18)); }
#wheel-shell { width: min(76vw, 40vh, 310px); aspect-ratio: 1; background: var(--edge); padding: 4px; }
#wheel {
  position: relative; width: 100%; height: 100%; touch-action: none; cursor: grab;
  background: radial-gradient(circle at 50% 35%, var(--wheel), var(--wheel2));
}
.wl { position: absolute; color: var(--wfg); font-family: var(--px); pointer-events: none; transition: transform .06s; }
.w-menu { top: 11%; left: 50%; transform: translateX(-50%); font-size: 11px; }
.w-prev { left: 9%; top: 50%; transform: translateY(-50%); font-size: 18px; }
.w-next { right: 9%; top: 50%; transform: translateY(-50%); font-size: 18px; }
.w-play { bottom: 10%; left: 50%; transform: translateX(-50%); font-size: 16px; }
#wheel[data-press="menu"] .w-menu { transform: translateX(-50%) scale(.85); color: var(--hl); }
#wheel[data-press="prev"] .w-prev { transform: translateY(-50%) scale(.85); color: var(--hl); }
#wheel[data-press="next"] .w-next { transform: translateY(-50%) scale(.85); color: var(--hl); }
#wheel[data-press="play"] .w-play { transform: translateX(-50%) scale(.85); color: var(--hl); }
#center {
  position: absolute; left: 50%; top: 50%; width: 36%; height: 36%; transform: translate(-50%, -50%);
  background: var(--center); background-image: radial-gradient(circle at 50% 30%, rgba(255,255,255,.18), rgba(0,0,0,.22)); cursor: pointer; touch-action: none;
}
#center::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 -5px 0 rgba(0,0,0,.18), inset 0 4px 0 rgba(255,255,255,.25); }
#center.down { transform: translate(-50%, -50%) scale(.94); filter: brightness(.9); }

/* ---------- Boot ---------- */
#boot {
  position: fixed; inset: 0; z-index: 100; background: var(--lcd); color: var(--fg); font-family: var(--px);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; text-align: center;
}
#boot::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(0,0,0,.07) 0 1px, transparent 1px 3px); }
.boot-logo { display: flex; flex-direction: column; align-items: center; gap: 18px; animation: drop .8s steps(8) both; }
.boot-icon { font-size: 80px; filter: drop-shadow(6px 6px 0 rgba(0,0,0,.25)); }
.boot-icon .pi { height: 1em; }
#boot h1 { margin: 0; font-size: 34px; line-height: 1.25; letter-spacing: 4px; font-weight: normal; text-shadow: 4px 4px 0 var(--dim); }
@keyframes drop { from { transform: translateY(-60vh); } 70% { transform: translateY(10px); } to { transform: none; } }
.boot-load { width: 160px; height: 14px; box-shadow: inset 0 0 0 2px var(--fg); padding: 3px; }
.boot-load i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--fg) 0 6px, transparent 6px 8px); animation: load 1.1s steps(10) .5s forwards; }
@keyframes load { to { width: 100%; } }
.boot-press { font-size: 13px; opacity: 0; }
#boot.ready .boot-press { animation: blink 1s steps(1) 1.7s infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
.boot-sub { font-size: 8px; color: var(--dim); }
#boot.gone { animation: bootOut .6s steps(6) forwards; pointer-events: none; }
@keyframes bootOut { to { clip-path: inset(50% 0 50% 0); } }

/* ---------- Portrait lock ---------- */

<script>/* db.js */
/* Tune In — IndexedDB storage (songs live on your phone, offline) */
const DB = (() => {
  let db;
  const p = req => new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); });
  function open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('tunein', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('tracks')) d.createObjectStore('tracks', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs');
        if (!d.objectStoreNames.contains('art')) d.createObjectStore('art');
      };
      r.onsuccess = () => { db = r.result; res(db); };
      r.onerror = () => rej(r.error);
    });
  }
  const st = (s, m = 'readonly') => db.transaction(s, m).objectStore(s);
  return {
    open,
    allTracks: () => p(st('tracks').getAll()),
    putTrack: t => p(st('tracks', 'readwrite').put(t)),
    delTrack: id => Promise.all([p(st('tracks', 'readwrite').delete(id)), p(st('blobs', 'readwrite').delete(id))]),
    putBlob: (id, b) => p(st('blobs', 'readwrite').put(b, id)),
    getBlob: id => p(st('blobs').get(id)),
    putArt: (k, b) => p(st('art', 'readwrite').put(b, k)),
    getArt: k => p(st('art').get(k)),
    hasArt: k => p(st('art').count(k)).then(n => n > 0),
    clear: () => Promise.all(['tracks', 'blobs', 'art'].map(s => p(st(s, 'readwrite').clear())))
  };
})();

</script>
<script>/* tags.js */
/* Tune In — tiny tag reader: ID3 (mp3), MP4/M4A (iTunes AAC/ALAC), FLAC. Pulls title/artist/album/art. */
const Tags = (() => {
  const dec = {};
  const td = enc => dec[enc] || (dec[enc] = (() => { try { return new TextDecoder(enc); } catch (e) { return new TextDecoder('utf-8'); } })());
  const u32 = (b, o) => ((b[o] << 24) | (b[o + 1] << 16) | (b[o + 2] << 8) | b[o + 3]) >>> 0;
  const syncsafe = (b, o) => ((b[o] & 0x7f) << 21) | ((b[o + 1] & 0x7f) << 14) | ((b[o + 2] & 0x7f) << 7) | (b[o + 3] & 0x7f);
  const bytes = async (f, s, n) => new Uint8Array(await f.slice(s, s + n).arrayBuffer());
  const str = (b, o, n) => { let s = ''; for (let i = 0; i < n; i++) s += String.fromCharCode(b[o + i]); return s; };

  function text(b, enc) {
    let s;
    if (enc === 0) s = td('iso-8859-1').decode(b);
    else if (enc === 1) {
      if (b[0] === 0xFE && b[1] === 0xFF) s = td('utf-16be').decode(b.subarray(2));
      else if (b[0] === 0xFF && b[1] === 0xFE) s = td('utf-16le').decode(b.subarray(2));
      else s = td('utf-16le').decode(b);
    } else if (enc === 2) s = td('utf-16be').decode(b);
    else s = td('utf-8').decode(b);
    return s.split('\0')[0].trim();

  function term(b, start, enc) {
    if (enc === 1 || enc === 2) { for (let i = start; i + 1 < b.length; i += 2) if (b[i] === 0 && b[i + 1] === 0) return i; return b.length; }
    for (let i = start; i < b.length; i++) if (b[i] === 0) return i;
    return b.length;
  }

    const out = new Uint8Array(b.length); let j = 0;
    for (let i = 0; i < b.length; i++) { out[j++] = b[i]; if (b[i] === 0xFF && b[i + 1] === 0) i++; }
    return out.subarray(0, j);
  }
  const ID3MAP = { TIT2: 'title', TT2: 'title', TPE1: 'artist', TP1: 'artist', TALB: 'album', TAL: 'album', TPE2: 'albumArtist', TP2: 'albumArtist', TRCK: 'track', TRK: 'track' };

  async function id3(f) {
    const h = await bytes(f, 0, 10);
    if (!(h[0] === 0x49 && h[1] === 0x44 && h[2] === 0x33)) return null;

      o += hl + fs;
      if (ID3MAP[id]) { if (!out[ID3MAP[id]]) out[ID3MAP[id]] = text(d.subarray(1), d[0]); }
      else if ((id === 'APIC' || id === 'PIC') && !out.art) {

    try {
      const blob = await Demo.render(s), art = await Demo.art(s.art);
      await addTrack(blob, { title: s.title, artist: 'The Tune In Band', album: 'Demo Cartridge', albumArtist: 'The Tune In Band', track: Demo.SONGS.indexOf(s) + 1, duration: blob.size / 88200 }, art);
      SFX.play('coin');
    } catch (e) { console.warn(e); toast('DEMO FAILED'); }
    importing.done++; upd();
  }
  importing = null; indexLib(); upd();
  toast('DEMO LOADED!<br><small>Music → Albums</small>', 2200, true); addXP(15);
}

/* ---------- Click wheel ---------- */
function pixelCircle(R) {
  const rows = []; for (let y = 0; y < 2 * R; y++) { const yc = y + 0.5 - R; rows.push(Math.round(Math.sqrt(Math.max(0, R * R - yc * yc)))); }
  const pts = [];
  for (let y = 0; y < 2 * R; y++) { const x = R + rows[y]; pts.push([x, y], [x, y + 1]); }
  for (let y = 2 * R - 1; y >= 0; y--) { const x = R - rows[y]; pts.push([x, y + 1], [x, y]); }
  return 'polygon(' + pts.map(([x, y]) => `${(x / (2 * R) * 100).toFixed(2)}% ${(y / (2 * R) * 100).toFixed(2)}%`).join(',') + ')';
}
function initWheel() {
  const wheel = $('#wheel'), center = $('#center');
  const pc = pixelCircle(22); $('#wheel-shell').style.clipPath = pc; wheel.style.clipPath = pc; center.style.clipPath = pixelCircle(10);
  $('#wheel-shell').style.webkitClipPath = pc; wheel.style.webkitClipPath = pc; center.style.webkitClipPath = pixelCircle(10);
  const ang = e => { const r = wheel.getBoundingClientRect(); return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI; };
  const zone = a => a > -135 && a <= -45 ? 'menu' : a > -45 && a <= 45 ? 'next' : a > 45 && a <= 135 ? 'play' : 'prev';
  let wp = null;
  wheel.addEventListener('pointerdown', e => {
    if (e.target.closest('#center')) return;
    e.preventDefault(); wheel.setPointerCapture(e.pointerId); wake(); Engine.resume();
    const a = ang(e); wp = { last: a, acc: 0, moved: 0, zone: zone(a), holding: false };
    wheel.dataset.press = wp.zone;
    if (wp.zone === 'next' || wp.zone === 'prev') {
      const z = wp.zone, me = wp;
      me.hold = setTimeout(() => { if (wp !== me) return; me.holding = true; me.iv = setInterval(() => { Engine.seek(Engine.time + (z === 'next' ? 5 : -5)); SFX.play('tick'); }, 160); }, 480);
    }
  });
  wheel.addEventListener('pointermove', e => {
    if (!wp) return;
    const a = ang(e); let d = a - wp.last; if (d > 180) d -= 360; if (d < -180) d += 360;
    wp.last = a; wp.acc += d; wp.moved += Math.abs(d);
    if (wp.moved > 14) { clearTimeout(wp.hold); delete wheel.dataset.press; }
    const step = [26, 17, 11][S.wheelSpeed];
    while (wp.acc >= step) { wp.acc -= step; wheelTurn(1); }
    while (wp.acc <= -step) { wp.acc += step; wheelTurn(-1); }
  });
  const end = () => {
    if (!wp) return; clearTimeout(wp.hold); clearInterval(wp.iv); delete wheel.dataset.press;
    if (!wp.holding && wp.moved < 14) wheelButton(wp.zone);
    wp = null;
  };
  wheel.addEventListener('pointerup', end); wheel.addEventListener('pointercancel', () => { if (wp) { clearTimeout(wp.hold); clearInterval(wp.iv); wp = null; delete wheel.dataset.press; } });

  let ct = null, cheld = false;
  center.addEventListener('pointerdown', e => {
    e.stopPropagation(); e.preventDefault(); center.setPointerCapture(e.pointerId); wake(); Engine.resume(); center.classList.add('down'); cheld = false;
    ct = setTimeout(() => { cheld = true; const v = topV(); v && v.centerHold && v.centerHold(); }, 600);
  });
  center.addEventListener('pointerup', e => {
    e.stopPropagation(); center.classList.remove('down'); clearTimeout(ct);
    if (!cheld) { haptic(); const v = topV(); v && v.center && v.center(); }
  });
  center.addEventListener('pointercancel', () => { center.classList.remove('down'); clearTimeout(ct); });
}
function wheelTurn(d) { const v = topV(); v && v.wheel && v.wheel(d); }
function wheelButton(z) {
  haptic();
  const v = topV();
  if (z === 'menu') { if (v && v.menu) v.menu(); else pop(); }
  else if (z === 'play') togglePlay();
  else if (z === 'next') { if (P.cur) { next(true); SFX.play('next'); } else SFX.play('error'); }
  else if (z === 'prev') { if (P.cur) { prev(); SFX.play('prev'); } else SFX.play('error'); }
}

/* ---------- Boot + main loop ---------- */
let lastFrame = performance.now(), autoT = 0, wasHidden = false;
function loop(now) {
  const dt = Math.min(0.1, (now - lastFrame) / 1000); lastFrame = now;
  Viz.update(dt);
  const v = topV(); v && v.tick && v.tick(dt);
  FullViz.tick();
  const vizOn = FullViz.isOpen || (v && (v.kind === 'viz'));
  if (vizOn && S.vizFlash && Viz.beat) flash();
  if (vizOn && S.vizAuto && !Engine.paused) { autoT += dt; if (autoT > [0, 15, 30, 60][S.vizAuto]) { autoT = 0; S.vizMode = (S.vizMode + 1) % Viz.MODES.length; save(); v && v.label && v.label(); FullViz.isOpen && FullViz.label(); } }
  requestAnimationFrame(loop);
}
let secN = 0;
function everySecond() {
  sleepTick(); backlightTick();
  if (++secN % 15 === 0) clockTick();
  if (!Engine.paused) { if (secN % 5 === 0) { saveResume(); save(); } msPosition(); }
}

async function boot() {
  applyTheme(S.theme); applyScreenFX(); clockTick();
  $('#file').addEventListener('change', e => { if (e.target.files && e.target.files.length) importFiles(e.target.files); });
  document.addEventListener('pointerdown', wake, { capture: true, passive: true });
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveResume(); else Engine.resume(); });
  window.addEventListener('pagehide', () => { saveResume(); localStorage.setItem('tunein.s', JSON.stringify(S)); });
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
  initWheel(); FullViz.init();
  try { await DB.open(); LIB = await DB.allTracks(); indexLib(); } catch (e) { console.warn('DB', e); toast('STORAGE ERROR'); }
  push(MainMenu());
  const b = $('#boot'); b.classList.add('ready');
  b.querySelector('.boot-sub').textContent = LIB.length ? `${LIB.length} SONGS LOADED · LV ${level(S.xp)}` : 'NEW GAME';
  b.addEventListener('click', start, { once: true });
  setInterval(everySecond, 1000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}
function start() {
  Engine.setup(!S.bgPlay);
  const ctx = Engine.ctx; if (ctx.state !== 'running') ctx.resume();
  SFX.init(ctx);
  Engine.setEQ(S.eq); Engine.setCrunch(S.crunch); Engine.setVolume(S.vol);
  // iOS: play a silent blip to fully unlock audio output
  try { const o = ctx.createBufferSource(); o.buffer = ctx.createBuffer(1, 1, 22050); o.connect(ctx.destination); o.start(0); } catch (e) {}
  setTimeout(() => SFX.play('boot'), 30);
  $('#boot').classList.add('gone'); setTimeout(() => $('#boot').remove(), 700);
  restoreResume();
  requestAnimationFrame(loop);
}
boot();

</script>
